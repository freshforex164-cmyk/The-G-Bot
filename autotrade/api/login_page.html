<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Connect Pocket Option</title>
<script nonce="{{NONCE}}" src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; --bg:#0f1720; --fg:#e8eef4; --muted:#93a4b5; --accent:#2fb37a; --bad:#e5604f; --card:#18232f; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
         height:100dvh; overflow:hidden; overscroll-behavior:none; }
  header { flex:none; display:flex; align-items:center; gap:8px; padding:6px 10px; padding-top:max(6px, env(safe-area-inset-top));
           max-width:520px; width:100%; margin:0 auto; min-height:40px; }
  #site { flex:none; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%; }
  #msg { flex:1; min-width:0; font-size:13px; color:var(--fg); }
  #msg.bad { color:var(--bad); } #msg.good { color:var(--accent); }
  button { padding:7px 12px; border-radius:8px; border:0; background:#2a3b4c; color:var(--fg); font-size:14px; }
  button.primary { background:var(--accent); color:#06140d; font-weight:600; }
  /* The stage is exactly the size the remote phone browser is rendered at, so the site fills it edge to edge. */
  #stage { position:relative; flex:1; width:100%; max-width:520px; margin:0 auto; min-height:0; background:#000; overflow:hidden;
           touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; display:none; }
  #screen { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; }
  /* A real, native input placed exactly over the field that is focused on the site: the phone's own keyboard,
     autofill and password manager work in it. Its text is invisible; the site's own field shows the result. */
  #proxy { position:absolute; left:0; top:0; width:1px; height:1px; opacity:0; border:0; padding:0; margin:0; background:transparent;
           color:transparent; caret-color:transparent; font-size:16px; pointer-events:none; }
  #proxy.on { opacity:.01; pointer-events:auto; }
  #start { margin:auto; text-align:center; padding:24px; max-width:360px; }
  #start p { color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <span id="site" hidden></span>
  <div id="msg">Preparing…</div>
  <button id="cancel" hidden>Cancel</button>
</header>
<div id="start" hidden>
  <p>This opens the Pocket Option login page in a private browser on our server, shown here like a normal phone
     website. We never read your password: once you are logged in we keep only the session for your Demo and
     Real accounts (encrypted) and close the browser.</p>
  <button class="primary" id="startBtn">Open Pocket Option login</button>
</div>
<div id="stage">
  <img id="screen" alt="Pocket Option">
  <input id="proxy" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Pocket Option field">
</div>
<script nonce="{{NONCE}}">
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  const token = new URLSearchParams(location.hash.slice(1)).get("t");
  history.replaceState(null, "", location.pathname);           // drop the token from the address bar
  const $ = (id) => document.getElementById(id);
  const msg = (t, cls) => { $("msg").textContent = t; $("msg").className = cls || ""; };
  const base = new URL(".", location.href);
  const api = (path, opts = {}) => fetch(new URL(path, base), {
    ...opts, cache: "no-store",
    headers: { "Authorization": "Bearer " + token, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  const stage = $("stage"), img = $("screen"), proxy = $("proxy");
  let sid = null, looping = false, lastUrl = null, statusTimer = null;
  let vw = 390, vh = 844, inputs = [], field = null, boostUntil = 0, lastTap = 0, nullCount = 0;
  let fieldKey = "", pending = null, sending = false, ended = false;

  if (!token) { msg("This link is missing its login code. Send /at_login in Telegram to get a new one.", "bad"); return; }

  function stopAll() { ended = true; looping = false; clearInterval(statusTimer); statusTimer = null; blurProxy(); }
  function expired() { stopAll(); msg("This login link has expired. Send /at_login in Telegram to get a new one.", "bad"); }

  // ---- start ------------------------------------------------------------------------------------
  async function begin() {
    $("start").hidden = true; msg("Opening the login page… (this can take ~10 seconds)");
    stage.style.display = "block";            // so we can measure it: the site is rendered at exactly this size
    const w = Math.round(stage.clientWidth), h = Math.round(stage.clientHeight);
    let r;
    try { r = await api("auth/handshake", { method: "POST", body: JSON.stringify({ width: w, height: h }) }); }
    catch (e) { r = null; }
    if (r && r.status === 401) return expired();
    if (!r || !r.ok) { stage.style.display = "none"; $("start").hidden = false; $("startBtn").textContent = "Try again";
                       msg("Could not open the login page right now. Try again in a minute.", "bad"); return; }
    sid = (await r.json()).session_id; ended = false;
    $("cancel").hidden = false;
    looping = true; loop(); statusTimer = setInterval(refreshStatus, 1500);
  }
  $("startBtn").onclick = begin;
  begin();

  // ---- live view: picture + where the focused input is --------------------------------------------
  async function loop() {
    while (looping) {
      await tick();
      await new Promise((res) => setTimeout(res, Date.now() < boostUntil ? 120 : 600));
    }
  }
  async function tick() {
    try {
      const [s, v] = await Promise.all([api(`auth/handshake/${sid}/screen`), api(`auth/handshake/${sid}/view`)]);
      if (s.status === 401 || v.status === 401) return expired();
      if (s.status === 409 || v.status === 409) { refreshStatus(); return; }     // browser already closed
      if (s.ok) { const u = URL.createObjectURL(await s.blob()); img.src = u; if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = u; }
      if (v.ok) applyView(await v.json());
    } catch (e) {}
  }
  function applyView(v) {
    vw = v.width; vh = v.height; inputs = v.inputs || []; field = v.field || null;
    if (v.host) { $("site").hidden = false; $("site").textContent = "🔒 " + v.host; }
    if (field) { nullCount = 0; placeProxy(field); }
    else if (++nullCount >= 2 && Date.now() - lastTap > 900) blurProxy();
  }

  // ---- native input over the focused field -------------------------------------------------------
  const sx = () => stage.clientWidth / vw, sy = () => stage.clientHeight / vh;
  function hint(f) {
    const n = (f.name || "").toLowerCase();
    if (f.type === "password") return { type: "password", ac: "current-password", mode: "text" };
    if (f.type === "email" || n.includes("email") || n.includes("login") || n.includes("user")) return { type: "text", ac: "username", mode: "email" };
    if (f.type === "tel" || n.includes("code") || n.includes("otp")) return { type: "text", ac: "one-time-code", mode: "numeric" };
    return { type: "text", ac: "off", mode: "text" };
  }
  function placeProxy(f) {
    const h = hint(f), key = [f.type, f.name, Math.round(f.x), Math.round(f.y)].join("|");
    Object.assign(proxy.style, { left: f.x * sx() + "px", top: f.y * sy() + "px", width: f.w * sx() + "px", height: f.h * sy() + "px" });
    proxy.classList.add("on");
    if (key !== fieldKey) {                     // a different field got focus on the site
      fieldKey = key; proxy.type = h.type; proxy.autocomplete = h.ac; proxy.inputMode = h.mode;
      proxy.value = f.type === "password" ? "" : (f.value || ""); pending = null;
    }
    if (document.activeElement !== proxy && Date.now() - lastTap < 3000) proxy.focus({ preventScroll: true });
  }
  function blurProxy() { proxy.classList.remove("on"); fieldKey = ""; if (document.activeElement === proxy) proxy.blur(); }

  async function flush() {
    if (sending) return; sending = true;
    try {
      while (pending !== null && !ended) {
        const value = pending; pending = null;
        const r = await postInput({ type: "value", value });
        if (r && r.status === 401) { expired(); break; }
      }
    } finally { sending = false; }
  }
  proxy.addEventListener("input", () => { pending = proxy.value.slice(0, 256); boostUntil = Date.now() + 1500; flush(); });
  proxy.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    while (sending || pending !== null) await new Promise((res) => setTimeout(res, 30));
    postInput({ type: "key", key: "Enter" }); boostUntil = Date.now() + 3000;
  });

  const postInput = (ev) => api(`auth/handshake/${sid}/input`, { method: "POST", body: JSON.stringify(ev) }).catch(() => null);

  // ---- touch: tap = tap on the site, drag = scroll the site ---------------------------------------------
  let down = null, scrollSent = 0, scrollAcc = 0;
  stage.addEventListener("pointerdown", (e) => {
    if (!sid || ended) return;
    stage.setPointerCapture(e.pointerId);
    down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
  });
  stage.addEventListener("pointermove", (e) => {
    if (!down) return;
    if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
    if (!down.moved) return;
    scrollAcc += (down.ly - e.clientY) / sy(); down.lx = e.clientX; down.ly = e.clientY;
    const now = Date.now();
    if (now - scrollSent > 90 && Math.abs(scrollAcc) >= 1) {
      scrollSent = now; const dy = Math.round(scrollAcc); scrollAcc = 0;
      postInput({ type: "scroll", dy, x: Math.round((e.clientX - stage.getBoundingClientRect().left) / sx()), y: Math.round((e.clientY - stage.getBoundingClientRect().top) / sy()) });
      boostUntil = now + 800;
    }
  });
  const end = (e) => {
    if (!down) return; const d = down; down = null; scrollAcc = 0;
    if (d.moved || e.type === "pointercancel") return;
    const rect = stage.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) / sx()), y = Math.round((e.clientY - rect.top) / sy());
    lastTap = Date.now(); boostUntil = lastTap + 2500;
    // Tapping a text box: focus our native input right now (inside the tap) so the phone keyboard opens at once.
    const hit = inputs.find((f) => x >= f.x - 4 && x <= f.x + f.w + 4 && y >= f.y - 4 && y <= f.y + f.h + 4);
    if (hit) { fieldKey = ""; placeProxy(hit); proxy.focus({ preventScroll: true }); }
    postInput({ type: "click", x, y });
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);

  // ---- progress ---------------------------------------------------------------------------------------
  async function refreshStatus() {
    if (!sid || ended) return;
    const r = await api(`auth/handshake/${sid}`).catch(() => null);
    if (!r) return;
    if (r.status === 401) return expired();
    if (!r.ok) return;
    const s = await r.json();
    if (s.state === "starting") msg("Opening the login page…");
    else if (s.state === "waiting_for_login") msg("Log in as you normally would (email and password, or Google).");
    else if (s.state === "capturing") msg("Logged in. Saving your Demo and Real sessions…");
    else {
      stopAll(); stage.style.display = "none"; $("cancel").hidden = true; $("site").hidden = true;
      if (s.state === "done") { msg("Connected. Go back to Telegram and send /at_start (your bot starts in Demo mode).", "good"); if (tg) setTimeout(() => tg.close(), 2500); }
      else if (s.state === "timeout") msg("The login took too long and was closed. Send /at_login for a new link.", "bad");
      else if (s.state === "cancelled") msg("Login cancelled.", "bad");
      else msg("The login could not be completed. Send /at_login to try again.", "bad");
    }
  }
  $("cancel").onclick = async () => {
    const id = sid; stopAll(); stage.style.display = "none"; $("cancel").hidden = true; $("site").hidden = true;
    await api(`auth/handshake/${id}`, { method: "DELETE" }).catch(() => null);
    msg("Login cancelled. Send /at_login to start again.", "bad");
  };
})();
</script>
</body>
</html>
