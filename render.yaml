services:
  - type: web
    name: gbot
    runtime: python
    buildCommand: pip install uv && uv sync --locked
    startCommand: .venv/bin/python main.py --run serve
    healthCheckPath: /health
    envVars:
      # 512 MB instance: two glibc malloc arenas (instead of 8 per core) and early trimming keep the
      # long-running asyncio process from fragmenting memory. No bytecode files are written.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      # Any Node helper (e.g. a Playwright driver) collects garbage early; never a 4096 MB heap here.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
